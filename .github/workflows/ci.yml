name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # ESLint parses every JS file and the inline <script> in the HTML pages, so it
      # also covers the syntax checks this job used to run with `node --check`.
      - name: Lint
        run: npm run lint

      - name: Run regression tests
        run: npm test

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload screenshots of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: test-results/
          if-no-files-found: ignore
